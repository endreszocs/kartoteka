# ═══════════════════════════════════════════════════════════════════════════
#  NAPI BIZTONSÁGI MENTÉS — ütemezett indítás (2026-08-13)
# ═══════════════════════════════════════════════════════════════════════════
#
#  MIÉRT ITT, ÉS NEM A RAILWAY-EN
#  A Railway „Cron Schedule" mezője NEM HTTP-hívást ütemez, hanem a szolgáltatás
#  INDÍTÓPARANCSÁT futtatja az ütemezés szerint. A saját dokumentációjuk mondja ki:
#  „When not to use railway's cron jobs? For long-running processes that don't
#  exit, such as a web server." A kartoteka.app egy webszerver — ha arra tennénk
#  cront, az oldal nem futna folyamatosan. Külön Railway-szolgáltatás megoldaná,
#  de az plusz díj. Ez itt ingyenes.
#
#  MIT CSINÁL (2026-08-14 óta: INDÍT ÉS RÖVIDEN FIGYEL)
#  Egy POST-tal ELINDÍTJA a mentést a szerveren (a supervisor háttér-ciklusát),
#  majd pár percig az állapotot kérdezgeti: a korai, rendszerszintű hibát
#  (nincs kulcs, halott tároló, nulla haladás) hangosan jelzi. A hosszú futás
#  a SZERVEREN megy tovább — a befejezés őre az admin → Biztonsági mentés
#  oldal és az őrszem-riasztás (e-mail + harang).
#
#  ⚠️ MIÉRT NEM VÁRJA VÉGIG (2026-08-14, mért eset): a régi változat a szeletet
#  EGY HTTP-kérésben futtatta végig, de a kartoteka.app előtt ülő Cloudflare
#  ~100 másodpercnél minden kérést elvág (HTTP 524) — az első éles hajnali
#  futás így bukott el. A végigvárás runner-percben is pazarlás lenne: egy
#  teljes országos kör órákig tarthat.
#
#  A napi kulcs (`backup_log` egyedi indexe) miatt a futás mindig ott folytatja,
#  ahol abbamaradt — kész hatókört SOHA nem ment újra.
#
#  ⚠️ IDŐZÓNA: a GitHub Actions ütemezése UTC-ben jár, akárcsak a Railway-é.
#  A `17 2 * * *` tehát Bukarestben NYÁRON 05:17, TÉLEN 04:17. Ez szándékos:
#  hajnalban a legkisebb a terhelés. Nem kerek óra — éjfélkor és egész órakor a
#  világ összes ütemezett feladata egyszerre indul, és a GitHub is torlódik.
#
#  ⚠️ A GitHub NEM garantálja a percre pontos indulást: terhelés esetén akár
#  10-60 percet is késhet. Napi mentésnél ez nem baj — de ne lepődj meg rajta.
#
#  MI KELL HOZZÁ (EGYSZER, TŐLED)
#  GitHub → a kartoteka repó → Settings → Secrets and variables → Actions →
#  „New repository secret":
#        Name:   BACKUP_WORKER_SECRET
#        Secret: ugyanaz az érték, ami a Railway Variables közt van
#  Amíg ezt nem veszed fel, ez a munkafolyamat CSENDBEN KILÉP (nem hibázik el,
#  nem küld naponta hibajelző levelet). Vagyis nyugodtan itt maradhat addig is.
# ═══════════════════════════════════════════════════════════════════════════

name: Napi biztonsági mentés

on:
  schedule:
    - cron: '17 2 * * *'
  # Kézi indítás a GitHub felületéről (Actions → Napi biztonsági mentés → Run workflow).
  # Hasznos próbához: nem kell megvárni a hajnalt.
  workflow_dispatch:

# Két futás soha ne fedje egymást: ha a hajnali még megy, a kézi indítás megvárja.
# (A `claimBackupLog` bérlete amúgy is véd a kettős mentéstől, de a torlódás
#  fölösleges terhelés a szerveren.)
concurrency:
  group: napi-mentes
  cancel-in-progress: false

jobs:
  mentes:
    runs-on: ubuntu-latest
    # Indítás + rövid figyelés — a futás maga a szerveren él, nem itt.
    timeout-minutes: 15

    steps:
      - name: A titok meglétének ellenőrzése
        id: orszem
        env:
          TITOK: ${{ secrets.BACKUP_WORKER_SECRET }}
        run: |
          if [ -z "$TITOK" ]; then
            echo "van=false" >> "$GITHUB_OUTPUT"
            echo "::notice::A BACKUP_WORKER_SECRET még nincs felvéve a repó titkai közé — a mentés nem indul el. Settings → Secrets and variables → Actions."
          else
            echo "van=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Mentés indítása és rövid figyelése
        if: steps.orszem.outputs.van == 'true'
        env:
          VEGPONT: https://kartoteka.app/api/internal/backup
          TITOK: ${{ secrets.BACKUP_WORKER_SECRET }}
        run: |
          set -uo pipefail

          # ── 1) INDÍTÁS — a POST azonnal visszatér (a futás a szerveren él) ──
          # A `--retry` az átmeneti hálózati/proxy hibákat (502/524) is újrázza.
          valasz=$(curl -sS -X POST "$VEGPONT" \
            -H "Authorization: Bearer $TITOK" \
            -H "Content-Type: application/json" \
            -d '{"forras":"github-actions"}' \
            --max-time 60 \
            --retry 3 --retry-delay 20 --retry-all-errors \
            -w '\n%{http_code}') || {
              echo "::error::Az indító hívás nem ért célba (hálózati hiba vagy időtúllépés)."
              exit 1
            }

          kod=$(printf '%s' "$valasz" | tail -n1)
          torzs=$(printf '%s' "$valasz" | sed '$d')
          echo "HTTP $kod"
          echo "$torzs"

          # ⚠️ ELŐBB a státuszkód, CSAK UTÁNA a jq: egy proxy-hibaoldal nem
          #    JSON, és a jq-elhasalás a valódi hibaüzenetet nyelné el (a
          #    2026-08-14-i 524-es bukás pontosan így halt meg exit 5-tel).
          if [ "$kod" -lt 200 ] || [ "$kod" -ge 300 ]; then
            echo "::error::A mentés-indítás hibát adott (HTTP $kod). Nézd meg az admin → Biztonsági mentés oldalt."
            exit 1
          fi

          inditva=$(printf '%s' "$torzs" | jq -r '.inditva // empty' 2>/dev/null || true)
          if [ "$inditva" = "false" ]; then
            echo "Már futott egy mentés a szerveren — nem indítottunk másodikat, azt figyeljük."
          else
            echo "✅ A mentés elindult a szerveren."
          fi

          # ── 2) RÖVID FIGYELÉS — a korai, rendszerszintű hiba itt derül ki ──
          # 10 × 30 mp = 5 perc. Ha eddig nem halt meg, jó eséllyel végigmegy;
          # a befejezés őre az admin-oldal + az őrszem-riasztás.
          sikeres=0
          kesz=0
          for i in $(seq 1 10); do
            sleep 30
            allapot=$(curl -sS "$VEGPONT" \
              -H "Authorization: Bearer $TITOK" \
              --max-time 60 \
              --retry 2 --retry-delay 10 --retry-all-errors \
              -w '\n%{http_code}') || {
                echo "::warning::Az állapot-lekérdezés nem ért célba ($i. próba) — folytatom."
                continue
              }
            akod=$(printf '%s' "$allapot" | tail -n1)
            atorzs=$(printf '%s' "$allapot" | sed '$d')
            if [ "$akod" -lt 200 ] || [ "$akod" -ge 300 ]; then
              echo "::warning::Az állapot-lekérdezés HTTP $akod-t adott ($i. próba) — folytatom."
              continue
            fi

            fut=$(printf '%s' "$atorzs"        | jq -r '.allapot.fut // empty'          2>/dev/null || true)
            ok_vege=$(printf '%s' "$atorzs"    | jq -r '.allapot.befejezesOka // empty' 2>/dev/null || true)
            sikeres=$(printf '%s' "$atorzs"    | jq -r '.allapot.sikeres // 0'          2>/dev/null || echo 0)
            kesz=$(printf '%s' "$atorzs"       | jq -r '.allapot.korabbanKesz // 0'     2>/dev/null || echo 0)
            hatralevo=$(printf '%s' "$atorzs"  | jq -r '.allapot.hatralevo // "?"'      2>/dev/null || echo '?')
            hiba=$(printf '%s' "$atorzs"       | jq -r '.allapot.utolsoHiba // empty'   2>/dev/null || true)

            echo "── $i. ellenőrzés: fut=$fut, kész ebben a futásban=$sikeres, korábban kész=$kesz, hátra=$hatralevo"

            if [ "$fut" != "true" ]; then
              case "$ok_vege" in
                kesz)
                  echo "✅ A mentés VÉGIGÉRT: minden hatókörhöz hozzáért."
                  exit 0 ;;
                hiba|nem_halad)
                  echo "::error::A mentés megállt ($ok_vege): ${hiba:-részletek az admin → Biztonsági mentés oldalon}."
                  exit 1 ;;
                *)
                  echo "::warning::A mentés megállt ($ok_vege) — nézd meg az admin → Biztonsági mentés oldalt."
                  exit 1 ;;
              esac
            fi
          done

          # 5 perc után még fut — ez normális (egy teljes kör órákig tarthat).
          if [ "${sikeres:-0}" -eq 0 ] && [ "${kesz:-0}" -eq 0 ]; then
            echo "::warning::5 perc alatt nem látszott haladás. Lehet lassú előkészítés is — nézd meg az admin → Biztonsági mentés oldalt."
          else
            echo "✅ A mentés rendben halad — a futás a SZERVEREN folytatódik."
          fi
          echo "A befejezést az admin → Biztonsági mentés oldal és az őrszem-riasztás igazolja."

      - name: Emlékeztető, ha a titok hiányzik
        if: steps.orszem.outputs.van != 'true'
        run: |
          echo "A napi mentés NEM indult el, mert a BACKUP_WORKER_SECRET nincs felvéve."
          echo "Ez nem hiba — a munkafolyamat szándékosan csendben kilép, amíg be nem állítod."
          echo "GitHub → Settings → Secrets and variables → Actions → New repository secret"
