[package]
name = "desktop"
version = "0.9.13"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# M2.2 — SQLCipher-titkosított SQLite saját Tauri commands-kel.
# A `bundled-sqlcipher-vendored-openssl` feature-rel **SEM** az SQLCipher-t,
# **SEM** az OpenSSL-t nem igényli a system-ből — mindkettő C-forrása a
# `libsqlite3-sys` + `openssl-src` crate-ben van, magától fordul.
# Első cargo build 15-25 perc (Windows MSVC-n kb. 4 GB RAM + 2 GB disk),
# inkrementális utána ~pár másodperc.
#
# ⚠️ WINDOWS BUILD-GOTCHA (2026-06-15): az openssl-src forrásból-fordítása
# elhasal (`C1041: cannot open program database …ossl_static.pdb`), ha a build
# (`target`) útvonala SZÓKÖZT vagy NEM-ASCII karaktert tartalmaz (pl. „Egyházi APP").
# Megoldás: a `npm run tauri build/dev` a `scripts/desktop-tauri.mjs` wrapperen át
# fut, ami ilyenkor tiszta target-mappára irányít (CARGO_TARGET_DIR). KÖZVETLEN
# `cargo build`/`cargo check` esetén kézzel: `set CARGO_TARGET_DIR=C:\kt` (+ `set CL=/FS`).
# Részletek: apps/desktop/src-tauri/BUILD.md
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# M2.3 — SQLCipher kulcs-tárolás OS-szintű titkos storage-ben.
# Windows: Credential Manager (DPAPI), macOS: Keychain, Linux: Secret Service.
#
# ⚠️ 2026-06-10 KRITIKUS JAVÍTÁS: a keyring v3-ban a platform-backendek
# feature-flag mögött vannak. Korábban itt csak `keyring = "3"` állt feature
# nélkül — ekkor a crate NÉMÁN egy memóriabeli "mock" tárolóra esik vissza,
# ami app-újraindításkor ÜRES. Emiatt veszett el minden indításkor: a Supabase
# session (→ újra be kellett jelentkezni), az offline PIN (→ minden indításkor
# PIN-beállítást kért) ÉS a SQLCipher DB-kulcs (→ a lokális DB minden indításkor
# auto-recovery-zett). Az alábbi target-specifikus feature-ök kapcsolják be a
# valódi OS-szintű titkos tárolót. (A base dep feature nélkül marad, hogy a crate
# minden platformon elérhető legyen; a feature-öket Cargo unió-zza per-target.)
keyring = "3"
# SQLCipher-kulcs generáláshoz: kriptográfiailag biztonságos RNG.
rand = "0.8"
hex = "0.4"
# M3.3 — eszköz-bind.
# `machine-uid`: pure-Rust hardware-fingerprint (Win registry MachineGuid,
#                macOS IOPlatformUUID, Linux /etc/machine-id).
# `ed25519-dalek`: keypair + signing (a Rust-kripto-standard; pure-Rust,
#                  nincs OpenSSL dependency — kis C-build).
# `base64`: public-key szerializálás a Supabase-re küldéshez.
machine-uid = "0.5"
ed25519-dalek = { version = "2", features = ["rand_core"] }
base64 = "0.22"
# Avatar-kepletoltes (2026-06-11): rustls-szel — nincs openssl-sys fuggoseg,
# a CORS-mentes letoltes Rust-oldalon fut (a webview fetch-et a kep-CDN-ek blokkoljak)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "charset", "http2"] }
# A-M6.9 — offline PIN hitelesítés.
# Az argon2id pure-Rust implementáció, OWASP-ajánlott paraméterekkel jön.
# A lelkész a PIN-t 30+ napos offline gap után is tudja használni a
# lokális SQLCipher DB unlock-olásához. Minden crate pure-Rust, nincs C-build.
argon2 = "0.5"
# M5 — auto-updater plugin.
# Ed25519-aláírt manifest JSON-t hitelesít + lehúzza az új MSI/NSIS-t.
# A `tauri-plugin-updater` pure-Rust a végén (az aláírás-ellenőrzéshez
# a már behozott ed25519-dalek is elég).
tauri-plugin-updater = "2"
# E0 (2026-06-11) — hivatalos EREK Excel-könyvelés írása/olvasása.
# `umya-spreadsheet`: pure-Rust xlsx, amely append-eléskor MEGŐRZI a többi lap
# képleteit / definiált neveit / struktúráját (a PoC-ban byte-pontosan bizonyítva,
# 26 lap / 45 név). A `Kassza` (készpénz) és az A/B/C… (bankszámla) lapok D–L
# oszlopaiba írunk, a képlet-cellákhoz (M/N + minden számolt lap) SOHA.
# `zip`: a `fullCalcOnLoad` patch-hez — az `xl/workbook.xml` újracsomagolása, hogy
# az Excel megnyitáskor magától újraszámoljon (nincs kézi F9).
umya-spreadsheet = "2"
zip = "2"

# 2026-06-10 — keyring platform-backend feature-ök (lásd a fenti megjegyzést).
# Windows Credential Manager / macOS Keychain / Linux Secret Service.
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

